{% extends "base.html" %}
{% block conteudo %}
<form method="get"><input name="q" value="{{ busca }}" placeholder="Buscar por nome, CPF ou e-mail">
<button>Buscar</button> <a class="btn" href="{{ url_for('pessoas.nova') }}">Nova pessoa</a></form>
<table><tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th>Nascimento</th><th></th></tr>
{% for p in pessoas %}
<tr><td>{{ p.nome }}</td><td>{{ p.cpf }}</td><td>{{ p.email }}</td><td>{{ p.telefone }}</td><td>{{ p.data_nascimento }}</td>
<td><a href="{{ url_for('pessoas.editar', pessoa_id=p.id) }}">Editar</a>
<form method="post" action="{{ url_for('pessoas.excluir', pessoa_id=p.id) }}" style="display:inline"
 onsubmit="return confirm('Excluir {{ p.nome }}?')"><button>Excluir</button></form></td></tr>
{% else %}<tr><td colspan="6">Nenhuma pessoa cadastrada.</td></tr>{% endfor %}
</table>
{% endblock %}
